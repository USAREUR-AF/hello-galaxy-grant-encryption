<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" width="740" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="740" height="440" fill="#0d1117"/>

  <text x="36" y="46" fill="#e6edf3" font-size="22" font-weight="600">The producer is a member of its own release-set</text>
  <text x="36" y="72" fill="#9aa7b4" font-size="14">It unwraps its own slot to get the DEK, seals each message, and publishes ciphertext.</text>

  <!-- Producer -->
  <rect x="36" y="120" width="188" height="150" rx="12" fill="#161b22" stroke="#f5b14c" stroke-width="1.8"/>
  <g transform="translate(56,140)">
    <circle cx="11" cy="11" r="10" fill="none" stroke="#f5b14c" stroke-width="2"/>
    <rect x="19" y="8" width="20" height="5" rx="1" fill="#f5b14c"/>
  </g>
  <text x="56" y="180" fill="#e6edf3" font-size="15" font-weight="600">producer K</text>
  <text x="56" y="200" fill="#f5b14c" font-size="12">a member of the release-set</text>
  <text x="56" y="222" fill="#9aa7b4" font-size="12">1. fetch keys/&lt;rs&gt;/&lt;gen&gt;</text>
  <text x="56" y="240" fill="#9aa7b4" font-size="12">2. unwrap OWN slot &#8594; DEK</text>
  <text x="56" y="258" fill="#7ee2a8" font-size="12">3. AES-256-GCM seal</text>

  <!-- data topic -->
  <path d="M 224 195 C 268 195, 268 195, 300 195" stroke="#5ec8cd" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
  <text x="238" y="186" fill="#9aa7b4" font-size="11.5">publish ciphertext</text>

  <rect x="300" y="150" width="404" height="92" rx="12" fill="none" stroke="#5ec8cd" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="318" y="180" fill="#5ec8cd" font-size="13" font-weight="600" font-family="monospace">data/&lt;release-set&gt;/&lt;topic&gt;</text>
  <g font-family="monospace" font-size="11" fill="#5ec8cd" opacity="0.7">
    <text x="318" y="204">a7 3e 90 c2 5f 11 8d 6b e0 42 ...</text>
  </g>
  <text x="318" y="228" fill="#9aa7b4" font-size="11.5">identical bytes delivered to every peer on the mesh</text>

  <!-- bus -->
  <line x1="120" y1="288" x2="704" y2="288" stroke="#5ec8cd" stroke-width="2" opacity="0.5"/>
  <path d="M 502 242 L 502 284" stroke="#5ec8cd" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <!-- consumer (member) -->
  <path d="M 250 288 L 250 322" stroke="#5ec8cd" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <rect x="150" y="326" width="220" height="96" rx="10" fill="#161b22" stroke="#7ee2a8" stroke-width="1.5"/>
  <text x="168" y="352" fill="#e6edf3" font-size="14" font-weight="600">consumer (member)</text>
  <text x="168" y="374" fill="#7ee2a8" font-size="12">unwraps its slot &#8594; same DEK</text>
  <text x="168" y="394" fill="#7ee2a8" font-size="12">opens the message</text>
  <text x="168" y="414" fill="#9aa7b4" font-size="12">plaintext recovered &#10003;</text>

  <!-- outsider (denied) -->
  <path d="M 560 288 L 560 322" stroke="#f0776b" stroke-width="1.5" fill="none" marker-end="url(#ahr)"/>
  <rect x="450" y="326" width="254" height="96" rx="10" fill="#161b22" stroke="#f0776b" stroke-width="1.5"/>
  <text x="468" y="352" fill="#e6edf3" font-size="14" font-weight="600">outsider (no slot)</text>
  <text x="468" y="374" fill="#9aa7b4" font-size="12">receives identical ciphertext</text>
  <text x="468" y="394" fill="#f0776b" font-size="12">no DEK &#8594; cannot open</text>
  <!-- crossed out lock -->
  <g transform="translate(660,360)">
    <rect x="0" y="10" width="26" height="20" rx="3" fill="none" stroke="#f0776b" stroke-width="2"/>
    <path d="M 5 10 V 5 a 8 8 0 0 1 16 0 V 10" fill="none" stroke="#f0776b" stroke-width="2"/>
    <line x1="-4" y1="34" x2="30" y2="0" stroke="#f0776b" stroke-width="2.5"/>
  </g>

  <text x="36" y="434" fill="#9aa7b4" font-size="12">The read cut is enforced by the crypto, not the router. No component decrypts in the read path.</text>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#5ec8cd"/>
    </marker>
    <marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#f0776b"/>
    </marker>
  </defs>
</svg>
