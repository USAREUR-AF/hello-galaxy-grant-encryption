<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="720" height="400" fill="#0d1117"/>

  <text x="36" y="46" fill="#e6edf3" font-size="22" font-weight="600">Two planes, one honest boundary</text>
  <text x="36" y="72" fill="#9aa7b4" font-size="14">The crypto cut reaches topic (release-set) granularity &#8212; not field or row.</text>

  <!-- Machine plane -->
  <rect x="36" y="104" width="320" height="256" rx="12" fill="#161b22" stroke="#f5b14c" stroke-width="1.8"/>
  <text x="56" y="134" fill="#f5b14c" font-size="15" font-weight="600">machine plane</text>
  <text x="56" y="156" fill="#9aa7b4" font-size="12.5">producers, consumers, services</text>

  <g transform="translate(56,176)">
    <circle cx="12" cy="12" r="11" fill="none" stroke="#7ee2a8" stroke-width="2"/>
    <rect x="21" y="9" width="20" height="5" rx="1" fill="#7ee2a8"/>
  </g>
  <text x="108" y="194" fill="#7ee2a8" font-size="13" font-weight="600">holds its own keypair</text>

  <text x="56" y="228" fill="#e6edf3" font-size="12.5">&#8226; unwraps its slot &#8594; DEK</text>
  <text x="56" y="252" fill="#e6edf3" font-size="12.5">&#8226; opens ciphertext directly</text>
  <text x="56" y="276" fill="#e6edf3" font-size="12.5">&#8226; access = per-topic (release-set)</text>
  <text x="56" y="300" fill="#9aa7b4" font-size="12">granularity stops at the stream</text>
  <rect x="56" y="316" width="284" height="30" rx="7" fill="#0d1117" stroke="#f5b14c" stroke-width="1.1"/>
  <text x="72" y="336" fill="#f5b14c" font-size="12">topic-granular &#183; end-to-end &#183; brokerless</text>

  <!-- Human plane -->
  <rect x="384" y="104" width="300" height="256" rx="12" fill="#161b22" stroke="#5ec8cd" stroke-width="1.8"/>
  <text x="404" y="134" fill="#5ec8cd" font-size="15" font-weight="600">human plane</text>
  <text x="404" y="156" fill="#9aa7b4" font-size="12.5">browser-only people</text>

  <g transform="translate(404,176)">
    <circle cx="12" cy="8" r="7" fill="none" stroke="#9aa7b4" stroke-width="2"/>
    <path d="M 0 26 a 12 12 0 0 1 24 0" fill="none" stroke="#9aa7b4" stroke-width="2"/>
  </g>
  <text x="448" y="194" fill="#f0776b" font-size="13" font-weight="600">holds no key</text>

  <text x="404" y="228" fill="#e6edf3" font-size="12.5">&#8226; reads via a mediated surface</text>
  <text x="404" y="252" fill="#e6edf3" font-size="12.5">&#8226; the surface is a member on their</text>
  <text x="420" y="270" fill="#9aa7b4" font-size="12">behalf; it unwraps, they view</text>
  <text x="404" y="296" fill="#e6edf3" font-size="12.5">&#8226; accountable via audit, not by</text>
  <text x="420" y="314" fill="#9aa7b4" font-size="12">a key in the browser</text>
  <rect x="404" y="322" width="264" height="26" rx="7" fill="#0d1117" stroke="#5ec8cd" stroke-width="1.1"/>
  <text x="420" y="340" fill="#5ec8cd" font-size="12">mediated read &#183; no key at the edge</text>

  <text x="36" y="386" fill="#9aa7b4" font-size="12">Honest scope: this controls who can decrypt a stream. Sub-stream (field/row) selection is a separate concern.</text>
</svg>
