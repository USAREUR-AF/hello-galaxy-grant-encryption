<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" width="740" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="740" height="420" fill="#0d1117"/>

  <text x="36" y="46" fill="#e6edf3" font-size="22" font-weight="600">Revocation is rotation</text>
  <text x="36" y="72" fill="#9aa7b4" font-size="14">Removing a member excludes it from the next generation. It keeps what it already held; it gets nothing new.</text>

  <!-- Generation N -->
  <rect x="36" y="110" width="270" height="200" rx="12" fill="#161b22" stroke="#5ec8cd" stroke-width="1.6"/>
  <text x="54" y="140" fill="#5ec8cd" font-size="14" font-weight="600" font-family="monospace">generation N</text>
  <text x="54" y="162" fill="#9aa7b4" font-size="12">bundle wraps DEK&#8341; to:</text>
  <g font-size="13">
    <rect x="54" y="176" width="234" height="34" rx="7" fill="#0d1117" stroke="#7ee2a8" stroke-width="1.2"/>
    <text x="70" y="198" fill="#7ee2a8" font-weight="600">slot a</text>
    <rect x="54" y="218" width="234" height="34" rx="7" fill="#0d1117" stroke="#7ee2a8" stroke-width="1.2"/>
    <text x="70" y="240" fill="#7ee2a8" font-weight="600">slot b</text>
    <rect x="54" y="260" width="234" height="34" rx="7" fill="#0d1117" stroke="#f5b14c" stroke-width="1.4"/>
    <text x="70" y="282" fill="#f5b14c" font-weight="600">slot c</text>
    <text x="130" y="282" fill="#9aa7b4" font-size="11.5">&#8592; to be revoked</text>
  </g>

  <!-- revoke action -->
  <g>
    <path d="M 306 210 C 342 210, 342 210, 380 210" stroke="#f0776b" stroke-width="2" fill="none" marker-end="url(#ahr)"/>
    <text x="316" y="200" fill="#f0776b" font-size="12" font-weight="600">revoke c</text>
    <text x="312" y="228" fill="#9aa7b4" font-size="11">&#8594; new generation</text>
  </g>

  <!-- Generation N+1 -->
  <rect x="380" y="110" width="270" height="200" rx="12" fill="#161b22" stroke="#5ec8cd" stroke-width="1.6"/>
  <text x="398" y="140" fill="#5ec8cd" font-size="14" font-weight="600" font-family="monospace">generation N+1</text>
  <text x="398" y="162" fill="#9aa7b4" font-size="12">fresh DEK&#8342;&#8330;&#8321; wraps to:</text>
  <g font-size="13">
    <rect x="398" y="176" width="234" height="34" rx="7" fill="#0d1117" stroke="#7ee2a8" stroke-width="1.2"/>
    <text x="414" y="198" fill="#7ee2a8" font-weight="600">slot a</text>
    <rect x="398" y="218" width="234" height="34" rx="7" fill="#0d1117" stroke="#7ee2a8" stroke-width="1.2"/>
    <text x="414" y="240" fill="#7ee2a8" font-weight="600">slot b</text>
    <rect x="398" y="260" width="234" height="34" rx="7" fill="#0d1117" stroke="#f0776b" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="414" y="282" fill="#f0776b" font-weight="600">no slot c</text>
  </g>

  <!-- what c can and cannot do -->
  <rect x="36" y="330" width="298" height="72" rx="10" fill="#161b22" stroke="#7ee2a8" stroke-width="1.3"/>
  <text x="52" y="356" fill="#7ee2a8" font-size="13" font-weight="600">c still opens generation N</text>
  <text x="52" y="378" fill="#9aa7b4" font-size="12">ciphertext it already received under DEK&#8341;</text>
  <text x="52" y="395" fill="#9aa7b4" font-size="12">&#8212; no retroactive un-sharing of held bytes</text>

  <rect x="352" y="330" width="298" height="72" rx="10" fill="#161b22" stroke="#f0776b" stroke-width="1.3"/>
  <text x="368" y="356" fill="#f0776b" font-size="13" font-weight="600">c cannot open generation N+1</text>
  <text x="368" y="378" fill="#9aa7b4" font-size="12">the new DEK was never wrapped to it;</text>
  <text x="368" y="395" fill="#9aa7b4" font-size="12">the producer re-keys and moves on</text>

  <!-- key generations glyph -->
  <text x="672" y="150" fill="#f5b14c" font-size="12" font-weight="600" transform="rotate(90 672 150)">rotate forward</text>

  <defs>
    <marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#f0776b"/>
    </marker>
  </defs>
</svg>
