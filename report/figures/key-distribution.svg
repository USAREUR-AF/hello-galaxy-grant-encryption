<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="720" height="470" fill="#0d1117"/>

  <text x="36" y="46" fill="#e6edf3" font-size="22" font-weight="600">Key distribution over the brokerless fabric</text>
  <text x="36" y="72" fill="#9aa7b4" font-size="14">The key service is off the data path. Everyone receives the bundle; only a slot-holder can open one.</text>

  <!-- Key service (off path) -->
  <rect x="36" y="110" width="200" height="120" rx="12" fill="#161b22" stroke="#f5b14c" stroke-width="1.8"/>
  <g transform="translate(56,132)">
    <circle cx="12" cy="12" r="11" fill="none" stroke="#f5b14c" stroke-width="2"/>
    <rect x="21" y="9" width="22" height="5" rx="1" fill="#f5b14c"/>
  </g>
  <text x="56" y="180" fill="#e6edf3" font-size="15" font-weight="600">per-site key service</text>
  <text x="56" y="200" fill="#9aa7b4" font-size="12">mints DEK, wraps per member,</text>
  <text x="56" y="216" fill="#9aa7b4" font-size="12">ECDSA-signs the bundle</text>
  <text x="46" y="252" fill="#f5b14c" font-size="11.5" font-weight="600" letter-spacing="0.5">OFF THE DATA PATH</text>

  <!-- publish arrow to topic -->
  <path d="M 236 170 C 280 170, 280 200, 320 200" stroke="#5ec8cd" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
  <text x="250" y="160" fill="#9aa7b4" font-size="11.5">publish</text>

  <!-- the topic / bundle on the fabric -->
  <rect x="320" y="150" width="364" height="100" rx="12" fill="none" stroke="#5ec8cd" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="338" y="178" fill="#5ec8cd" font-size="13" font-weight="600" font-family="monospace">keys/&lt;release-set&gt;/&lt;generation&gt;</text>
  <text x="338" y="200" fill="#9aa7b4" font-size="12">signed bundle &#183; slot A &#183; slot B &#183; slot C</text>
  <g font-size="11">
    <rect x="338" y="212" width="70" height="24" rx="5" fill="#161b22" stroke="#7ee2a8" stroke-width="1"/>
    <text x="352" y="228" fill="#7ee2a8">slot A</text>
    <rect x="416" y="212" width="70" height="24" rx="5" fill="#161b22" stroke="#7ee2a8" stroke-width="1"/>
    <text x="430" y="228" fill="#7ee2a8">slot B</text>
    <rect x="494" y="212" width="70" height="24" rx="5" fill="#161b22" stroke="#7ee2a8" stroke-width="1"/>
    <text x="508" y="228" fill="#7ee2a8">slot C</text>
  </g>
  <text x="600" y="142" fill="#9aa7b4" font-size="11">on the mesh &#8212; broadcast to all</text>

  <!-- fabric bus line -->
  <line x1="120" y1="300" x2="684" y2="300" stroke="#5ec8cd" stroke-width="2" opacity="0.55"/>
  <text x="120" y="292" fill="#5ec8cd" font-size="11.5" opacity="0.8">Zenoh fabric &#8212; no broker, no decryptor</text>

  <!-- drops from topic to bus -->
  <path d="M 502 250 L 502 296" stroke="#5ec8cd" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>

  <!-- Members receiving -->
  <g>
    <!-- member A -->
    <path d="M 180 300 L 180 340" stroke="#5ec8cd" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
    <rect x="120" y="344" width="150" height="94" rx="10" fill="#161b22" stroke="#7ee2a8" stroke-width="1.5"/>
    <text x="136" y="370" fill="#e6edf3" font-size="14" font-weight="600">member A</text>
    <text x="136" y="392" fill="#7ee2a8" font-size="12">holds keypair A</text>
    <text x="136" y="412" fill="#9aa7b4" font-size="12">unwraps slot A</text>
    <text x="136" y="430" fill="#7ee2a8" font-size="12" font-weight="600">&#8594; DEK</text>

    <!-- member B -->
    <path d="M 372 300 L 372 340" stroke="#5ec8cd" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
    <rect x="312" y="344" width="150" height="94" rx="10" fill="#161b22" stroke="#7ee2a8" stroke-width="1.5"/>
    <text x="328" y="370" fill="#e6edf3" font-size="14" font-weight="600">member B</text>
    <text x="328" y="392" fill="#7ee2a8" font-size="12">holds keypair B</text>
    <text x="328" y="412" fill="#9aa7b4" font-size="12">unwraps slot B</text>
    <text x="328" y="430" fill="#7ee2a8" font-size="12" font-weight="600">&#8594; DEK</text>

    <!-- outsider -->
    <path d="M 590 300 L 590 340" stroke="#f0776b" stroke-width="1.5" fill="none" marker-end="url(#ahr)"/>
    <rect x="512" y="344" width="172" height="94" rx="10" fill="#161b22" stroke="#f0776b" stroke-width="1.5"/>
    <text x="528" y="370" fill="#e6edf3" font-size="14" font-weight="600">outsider</text>
    <text x="528" y="392" fill="#9aa7b4" font-size="12">receives the same bytes</text>
    <text x="528" y="412" fill="#f0776b" font-size="12">has no slot</text>
    <text x="528" y="430" fill="#f0776b" font-size="12" font-weight="600">&#8594; cannot unwrap</text>
  </g>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#5ec8cd"/>
    </marker>
    <marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#f0776b"/>
    </marker>
  </defs>
</svg>
